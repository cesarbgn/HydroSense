# Broker de HydroSense
listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# SOLO PARA DESARROLLO: acepta clientes sin usuario.
allow_anonymous true

# Para activar autenticación:
#   1. docker compose -f infra/docker-compose.yml exec mosquitto \
#        mosquitto_passwd -c /mosquitto/data/passwd hydrosense
#   2. Cambiar la línea de arriba por:
#        allow_anonymous false
#        password_file /mosquitto/data/passwd
#   3. Poner usuario y contraseña en MQTT_URL y en los ESP32, y reiniciar el servicio.
